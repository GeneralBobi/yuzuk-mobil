apply plugin: 'com.android.application'

android {
    namespace = "app.claudian.yuzuk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.claudian.yuzuk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11700
        versionName "0.11.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Çevrimdışı yazıya dökme (whisper.cpp): telefonlar arm64; x86_64 yalnız emülatör için ve yalnız hata ayıklama
        // derlemesinde (0.8.0: yayın APK'sında ~3,6 MB gereksiz yük). Değer buildTypes'ta verilir.
        externalNativeBuild { cmake { arguments "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_TYPE=Release"; cppFlags "" } } // hata ayıklama derlemesinde de yerel kod optimize: yoksa whisper dakikalar sürer
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig = true } // BuildConfig.DEBUG: test girişi yalnız hata ayıklama derlemesinde
    ndkVersion = "28.2.13676358"
    externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
    // Yayın derlemesi (APK ve Play AAB) her zaman yükleme anahtarıyla imzalanır (android/keystore.properties, git'e girmez).
    // Anahtar yoksa derleme durur: hata ayıklama anahtarıyla imzalı bir APK dağıtıma çıkmaz (güvenlik raporu 0.29.0).
    def anahtarDosyasi = rootProject.file("keystore.properties")
    signingConfigs {
        if (anahtarDosyasi.exists()) {
            yukleme {
                def a = new Properties()
                anahtarDosyasi.withInputStream { a.load(it) }
                storeFile rootProject.file(a['storeFile'].replace('../', ''))
                storePassword a['storePassword']
                keyAlias a['keyAlias']
                keyPassword a['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Test APK'sı kurulu Yüzük'ün verisini veya bağlantısını devralmaz.
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            resValue "string", "app_name", "Yüzük Test"
            ndk { abiFilters "arm64-v8a", "x86_64" }
        }
        release {
            ndk { abiFilters "arm64-v8a" }
            minifyEnabled false
            if (!anahtarDosyasi.exists()) throw new GradleException("android/keystore.properties yok: yayın derlemesi yükleme anahtarı olmadan imzalanmaz.")
            signingConfig = signingConfigs.yukleme
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.10.1"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
